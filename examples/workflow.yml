name: safety-gate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: munzzyy/ci-safety-gate@v0.1.1
        # every check defaults to on; turn one off explicitly if it doesn't apply
        with:
          skillxray: "true"   # auto-skips cleanly if there's no SKILL.md / skills/ / .claude / .claude-plugin
          zizmor-offline: "true"
          checkout-safety-fail-on: "medium"  # also fail on a stale actions/checkout pin
