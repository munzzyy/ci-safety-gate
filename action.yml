name: "CI Safety Gate"
description: >-
  One pass/fail gate that bundles a GitHub Actions security audit (zizmor),
  an agent-skill scanner (skillxray), and a bundled secrets grep, with a
  combined summary in the job.
author: "Cole Munz"

branding:
  icon: "shield"
  color: "blue"

inputs:
  python-version:
    description: "Python version used to install and run the bundled checks."
    required: false
    default: "3.12"

  zizmor:
    description: "Run zizmor's GitHub Actions security audit."
    required: false
    default: "true"
  zizmor-version:
    description: "Version specifier pip installs zizmor with. A floor rather than an exact pin, so a fix ships without a release here; 1.28.0 is the first version without GHSA-f42p-wjw5-97qh, which printed available GitHub credentials in cleartext."
    required: false
    default: ">=1.28.0"
  zizmor-persona:
    description: "Which zizmor persona to run (regular, pedantic, or auditor). auditor is the default because several audits, secrets-outside-env among them, only fire under it, so a regular run reports a pass while a whole class of findings stays hidden."
    required: false
    default: "auditor"
  zizmor-path:
    description: "Path zizmor audits (workflows and any action.yml under it)."
    required: false
    default: "."
  zizmor-min-severity:
    description: "Minimum severity zizmor reports (informational|low|medium|high)."
    required: false
    default: "medium"
  zizmor-offline:
    description: "Restrict zizmor to offline audits (no GitHub API calls, no token needed)."
    required: false
    default: "true"

  skillxray:
    description: "Run skillxray over any SKILL.md / skills / .claude content in the repo."
    required: false
    default: "true"
  skillxray-ref:
    description: "Commit of munzzyy/skillxray to install (it installs from source until it's on PyPI). Pinned by full commit SHA, not by tag, because a tag can be moved under you; this one is v0.1.1."
    required: false
    default: "aef787dda4cdec000c5d200ec203d076dc75b6ff"
  skillxray-path:
    description: "Path to scan. Leave empty to auto-detect SKILL.md / skills/ / .claude and skip cleanly if none exist."
    required: false
    default: ""
  skillxray-fail-on:
    description: "Minimum severity that fails skillxray (critical|high|medium|low|none)."
    required: false
    default: "high"

  secrets:
    description: "Run the bundled stdlib secrets scan (scan_secrets.py)."
    required: false
    default: "true"
  secrets-path:
    description: "Path the secrets scan walks."
    required: false
    default: "."
  secrets-exclude:
    description: "Space-separated glob(s), relative to secrets-path, to skip."
    required: false
    default: ""
  secrets-max-bytes:
    description: "Skip files larger than this many bytes."
    required: false
    default: "2000000"
  secrets-fail-on-skip:
    description: "Fail the secrets scan if any file could not be read (too large, unreadable, binary, a symlink) instead of only reporting it. Directories skipped by policy, .git and __pycache__ among them, never fail the run. Default reports without failing."
    required: false
    default: "false"
  secrets-annotations:
    description: "Emit a GitHub annotation per secrets finding, so it lands on the diff in Files Changed instead of only in the job summary."
    required: false
    default: "true"

  checkout-safety:
    description: "Check the repo's workflows for an unsafe fork pull request checkout."
    required: false
    default: "true"
  checkout-safety-path:
    description: "Repo root whose .github/workflows the check reads (or a single workflow file)."
    required: false
    default: "."
  checkout-safety-fail-on:
    description: "Minimum severity that fails the checkout-safety check (high|medium|low|none). Default high, which fails on an explicit allow-unsafe-pr-checkout or a stale pin on a step that checks out the pull request head, and reports the rest."
    required: false
    default: "high"

outputs:
  result:
    description: "'pass' or 'fail', the combined verdict across every enabled check."
    value: ${{ steps.evaluate.outputs.result }}

runs:
  using: "composite"
  steps:
    - name: Set up Python
      id: setup-python
      # Every later step's `if:` implicitly requires success() unless it
      # says otherwise, so without this a failure here would silently skip
      # the rest of the job -- including checks that don't even need this
      # specific pinned Python. continue-on-error lets them each still get
      # a real, independent outcome; "Evaluate gate" is what turns "this
      # step didn't run" into a loud fail instead of a quiet pass.
      continue-on-error: true
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: ${{ inputs.python-version }}

    - name: Start the combined summary
      shell: bash
      run: |
        {
          echo "# CI Safety Gate"
          echo ""
        } >> "$GITHUB_STEP_SUMMARY"

    - name: Secrets scan
      id: secrets
      if: inputs.secrets == 'true'
      shell: bash
      continue-on-error: true
      run: |
        set +e
        set -f  # exclude patterns are globs for scan_secrets.py, not for bash to expand
        args=("${INPUTS_SECRETS_PATH}" --max-bytes "${INPUTS_SECRETS_MAX_BYTES}" --summary)
        if [ -n "${INPUTS_SECRETS_EXCLUDE}" ]; then
          for pat in ${INPUTS_SECRETS_EXCLUDE}; do
            args+=(--exclude "$pat")
          done
        fi
        set +f
        if [ "${INPUTS_SECRETS_FAIL_ON_SKIP}" = "true" ]; then
          args+=(--fail-on-skip)
        fi
        if [ "${INPUTS_SECRETS_ANNOTATIONS}" = "true" ]; then
          args+=(--github-annotations)
        fi
        # Only stdout is redirected into the summary. The annotations go to
        # stderr precisely so they stay in the job log, where the runner
        # reads workflow commands; a ::error line written into a markdown
        # file does nothing.
        python3 "${{ github.action_path }}/scan_secrets.py" "${args[@]}" >> "$GITHUB_STEP_SUMMARY"
        code=$?
        set -e
        exit "$code"
      env:
        INPUTS_SECRETS_PATH: ${{ inputs.secrets-path }}
        INPUTS_SECRETS_MAX_BYTES: ${{ inputs.secrets-max-bytes }}
        INPUTS_SECRETS_EXCLUDE: ${{ inputs.secrets-exclude }}
        INPUTS_SECRETS_FAIL_ON_SKIP: ${{ inputs.secrets-fail-on-skip }}
        INPUTS_SECRETS_ANNOTATIONS: ${{ inputs.secrets-annotations }}

    - name: Checkout safety
      id: checkout-safety
      if: inputs.checkout-safety == 'true'
      shell: bash
      continue-on-error: true
      run: |
        set +e
        python3 "${{ github.action_path }}/checkout_safety.py" "${INPUTS_CHECKOUT_SAFETY_PATH}" \
          --fail-on "${INPUTS_CHECKOUT_SAFETY_FAIL_ON}" --summary >> "$GITHUB_STEP_SUMMARY"
        code=$?
        set -e
        exit "$code"
      env:
        INPUTS_CHECKOUT_SAFETY_PATH: ${{ inputs.checkout-safety-path }}
        INPUTS_CHECKOUT_SAFETY_FAIL_ON: ${{ inputs.checkout-safety-fail-on }}

    - name: Install zizmor
      id: install-zizmor
      if: inputs.zizmor == 'true'
      shell: bash
      # A yanked pin, a registry outage, or a network policy can fail this
      # without failing the job outright (see the comment on Set up
      # Python) -- continue-on-error plus the id lets "Evaluate gate" tell
      # "this check's install broke" apart from "this check is disabled".
      continue-on-error: true
      run: python3 -m pip install --quiet "zizmor${INPUTS_ZIZMOR_VERSION}"
      env:
        INPUTS_ZIZMOR_VERSION: ${{ inputs.zizmor-version }}

    - name: zizmor
      id: zizmor
      if: inputs.zizmor == 'true'
      shell: bash
      continue-on-error: true
      run: |
        set +e
        out="$RUNNER_TEMP/zizmor.out"
        offline_flag=""
        if [ "${INPUTS_ZIZMOR_OFFLINE}" = "true" ]; then
          offline_flag="--offline"
        fi
        zizmor --no-progress --color never $offline_flag \
          --persona "${INPUTS_ZIZMOR_PERSONA}" \
          --min-severity "${INPUTS_ZIZMOR_MIN_SEVERITY}" \
          "${INPUTS_ZIZMOR_PATH}" > "$out" 2>&1
        code=$?
        {
          echo "## zizmor (GitHub Actions security audit)"
          echo ""
          echo '```'
          cat "$out"
          echo '```'
        } >> "$GITHUB_STEP_SUMMARY"
        set -e
        exit "$code"
      env:
        INPUTS_ZIZMOR_OFFLINE: ${{ inputs.zizmor-offline }}
        INPUTS_ZIZMOR_PERSONA: ${{ inputs.zizmor-persona }}
        INPUTS_ZIZMOR_MIN_SEVERITY: ${{ inputs.zizmor-min-severity }}
        INPUTS_ZIZMOR_PATH: ${{ inputs.zizmor-path }}

    - name: Detect skill-shaped content
      id: skillxray-detect
      if: inputs.skillxray == 'true'
      shell: bash
      run: |
        target="${INPUTS_SKILLXRAY_PATH}"
        if [ -z "$target" ]; then
          # -L (follow symlinks) so a symlinked SKILL.md / skills/ / .claude
          # is caught, matching the Python port (os.walk lists symlinked
          # markers). Plain -type keeps this portable to BSD/macOS find,
          # which lacks the GNU-only referent-type primary: with -L, -type
          # reports the referent's type, so a symlink-to-file SKILL.md is
          # -type f while a directory named SKILL.md is -type d and correctly
          # excluded.
          if find -L "${{ github.workspace }}" -maxdepth 6 \
               \( -path '*/.git' -o -path '*/node_modules' \) -prune -o \
               \( -type f -name 'SKILL.md' -o -type d -name 'skills' -o -type d -name '.claude' \) -print \
               2>/dev/null | grep -q .; then
            target="${{ github.workspace }}"
          fi
        fi
        echo "target=$target" >> "$GITHUB_OUTPUT"
      env:
        INPUTS_SKILLXRAY_PATH: ${{ inputs.skillxray-path }}

    - name: Install skillxray
      id: install-skillxray
      if: inputs.skillxray == 'true' && steps.skillxray-detect.outputs.target != ''
      shell: bash
      # See the comment on "Install zizmor" -- same reasoning.
      continue-on-error: true
      run: python3 -m pip install --quiet "git+https://github.com/munzzyy/skillxray@${INPUTS_SKILLXRAY_REF}"
      env:
        INPUTS_SKILLXRAY_REF: ${{ inputs.skillxray-ref }}

    - name: skillxray
      id: skillxray
      if: inputs.skillxray == 'true' && steps.skillxray-detect.outputs.target != ''
      shell: bash
      continue-on-error: true
      run: |
        set +e
        out="$RUNNER_TEMP/skillxray.out"
        python3 -m skillxray "${STEPS_SKILLXRAY_DETECT_OUTPUTS_TARGET}" \
          --fail-on "${INPUTS_SKILLXRAY_FAIL_ON}" --no-color > "$out" 2>&1
        code=$?
        {
          echo "## skillxray (agent-skill scanner)"
          echo ""
          echo '```'
          cat "$out"
          echo '```'
        } >> "$GITHUB_STEP_SUMMARY"
        set -e
        exit "$code"
      env:
        STEPS_SKILLXRAY_DETECT_OUTPUTS_TARGET: ${{ steps.skillxray-detect.outputs.target }}
        INPUTS_SKILLXRAY_FAIL_ON: ${{ inputs.skillxray-fail-on }}

    - name: Note skipped skillxray
      if: inputs.skillxray == 'true' && steps.skillxray-detect.outputs.target == ''
      shell: bash
      run: |
        {
          echo "## skillxray (agent-skill scanner)"
          echo ""
          echo "skipped: no SKILL.md, skills/, or .claude/ found"
        } >> "$GITHUB_STEP_SUMMARY"

    - name: Evaluate gate
      id: evaluate
      if: always()
      shell: bash
      # The decision itself lives in evaluate_gate.py (unit tested in
      # tests/test_evaluate_gate.py) rather than inline here, because a
      # bare case statement on each scan step's own outcome can't tell "this
      # check is disabled" apart from "this check's install broke and it
      # never ran" -- both read as outcome=skipped. The install steps'
      # outcomes are what let it tell those apart.
      run: python3 "${{ github.action_path }}/evaluate_gate.py"
      env:
        STEPS_SETUP_PYTHON_OUTCOME: ${{ steps.setup-python.outcome }}
        INPUTS_SECRETS: ${{ inputs.secrets }}
        STEPS_SECRETS_OUTCOME: ${{ steps.secrets.outcome }}
        INPUTS_CHECKOUT_SAFETY: ${{ inputs.checkout-safety }}
        STEPS_CHECKOUT_SAFETY_OUTCOME: ${{ steps.checkout-safety.outcome }}
        INPUTS_ZIZMOR: ${{ inputs.zizmor }}
        STEPS_INSTALL_ZIZMOR_OUTCOME: ${{ steps.install-zizmor.outcome }}
        STEPS_ZIZMOR_OUTCOME: ${{ steps.zizmor.outcome }}
        INPUTS_SKILLXRAY: ${{ inputs.skillxray }}
        STEPS_SKILLXRAY_DETECT_OUTPUTS_TARGET: ${{ steps.skillxray-detect.outputs.target }}
        STEPS_INSTALL_SKILLXRAY_OUTCOME: ${{ steps.install-skillxray.outcome }}
        STEPS_SKILLXRAY_OUTCOME: ${{ steps.skillxray.outcome }}
